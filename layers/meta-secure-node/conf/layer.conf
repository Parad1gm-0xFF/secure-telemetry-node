# meta-secure-node : layer Yocto du noeud de telemetrie securise
# Alignement redpesk : dans la redpesk factory, un BSP/app = un package RPM.
# Ici on montre la "voie Yocto" classique (recipe .bb) que redpesk sait aussi
# consommer comme source de BSP.

BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

# Priorite elevee pour pouvoir remplacer un recipe upstream si besoin.
BBFILE_COLLECTIONS += "secure-node"
BBFILE_PATTERN_secure-node = "^${LAYERDIR}/"
BBFILE_PRIORITY_secure-node = "10"

LAYERDEPENDS_secure-node = "core"
LAYERSERIES_COMPAT_secure-node = "scarthgap kirkstone"

# Les recipes attendent la chaine Rust aarch64 (musl).
# On le declare au niveau layer pour que bitbake trouve l'outillage.