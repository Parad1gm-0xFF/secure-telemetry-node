[package]
name = "secure-telemetry-node"
version = "0.1.0"
edition = "2021"
description = "Demon minimal de noeud de telemetrie securise pour Linux embarque (alignement redpesk)"
license = "Apache-2.0"

# Cibles : aarch64-unknown-linux-musl (RPi3B+/arm64), riscv64gc-unknown-linux-musl.
[[bin]]
name = "secure-telemetry-node"
path = "src/main.rs"

[dependencies]
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Binaire totalement statique sur les cibles musl (indispensable riscv64).
[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static"]
[target.riscv64gc-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static"]